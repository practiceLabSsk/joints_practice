<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <title>人体関節 3D ビューア</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">J</span>
          <div>
            <p class="eyebrow">MOTION LAB</p>
            <h1>人体関節 3D ビューア</h1>
          </div>
        </div>
        <div class="renderer-status" aria-live="polite">
          <span class="status-indicator" aria-hidden="true"></span>
          <span id="renderer-status-text">Three.js を準備しています</span>
        </div>
      </header>

      <div class="workspace">
        <aside class="side-panel control-panel" aria-labelledby="controls-heading">
          <div class="panel-heading">
            <p class="panel-kicker">JOINT EDITOR</p>
            <h2 id="controls-heading">関節位置</h2>
          </div>

          <label class="field-label" for="joint-select">対象の関節</label>
          <select id="joint-select"></select>

          <div class="coordinate-controls" aria-label="選択中の関節の座標">
            <div class="axis-control">
              <label for="coordinate-x">X座標</label>
              <input id="coordinate-x" type="number" step="any" inputmode="decimal" />
              <input id="coordinate-x-slider" type="range" min="-3" max="3" step="0.01" aria-label="X座標スライダー" />
            </div>
            <div class="axis-control">
              <label for="coordinate-y">Y座標</label>
              <input id="coordinate-y" type="number" step="any" inputmode="decimal" />
              <input id="coordinate-y-slider" type="range" min="-3" max="3" step="0.01" aria-label="Y座標スライダー" />
            </div>
            <div class="axis-control">
              <label for="coordinate-z">Z座標</label>
              <input id="coordinate-z" type="number" step="any" inputmode="decimal" />
              <input id="coordinate-z-slider" type="range" min="-3" max="3" step="0.01" aria-label="Z座標スライダー" />
            </div>
          </div>

          <p class="control-note">単位: m　/　スライダー: −3〜3 m</p>
          <div class="panel-actions">
            <button id="reset-joints" class="primary-button" type="button">関節位置をリセット</button>
            <button id="reset-camera" class="secondary-button" type="button" disabled>カメラをリセット</button>
          </div>
        </aside>

        <section class="viewer-panel" aria-label="3D表示">
          <div class="viewer-heading">
            <span>3D VIEWPORT</span>
            <span class="step-label">STEP 06 / 08</span>
          </div>
          <div id="scene-view" class="scene-view">
            <canvas id="scene-canvas" aria-label="人体関節を表示する3D画面"></canvas>
            <div id="axis-legend" class="axis-legend" aria-label="軸の色" hidden>
              <span><i class="axis-swatch axis-x" aria-hidden="true"></i>X</span>
              <span><i class="axis-swatch axis-y" aria-hidden="true"></i>Y</span>
              <span><i class="axis-swatch axis-z" aria-hidden="true"></i>Z</span>
            </div>
            <div class="scene-message" aria-label="カメラ操作方法">
              <span class="scene-message-dot" aria-hidden="true"></span>
              <p id="scene-message-title">カメラ操作</p>
              <span id="scene-message-detail">左ドラッグ: 回転<br />右ドラッグ: 平行移動<br />ホイール: 拡大・縮小</span>
            </div>
          </div>
        </section>

        <aside class="side-panel coordinate-panel" aria-labelledby="coordinate-heading">
          <div class="panel-heading">
            <p class="panel-kicker">LIVE DATA</p>
            <h2 id="coordinate-heading">全関節の座標</h2>
          </div>
          <div id="coordinate-list" class="coordinate-list" role="list" aria-label="9関節のXYZ座標"></div>
        </aside>
      </div>

      <footer class="app-footer">
        <span>STEP 6</span>
        <span>9関節の座標を入力・表示できます</span>
      </footer>
    </main>
  </body>
</html>
